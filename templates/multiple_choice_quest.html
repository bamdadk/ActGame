<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Neuro Quest - Multiple Choice</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        .glass-panel {
            background: rgba(27, 31, 44, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
        .progress-pulse {
            position: relative;
            overflow: hidden;
        }
        .progress-pulse::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 30px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
        }
    
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .progress-pulse {
            background: linear-gradient(90deg, #dbfcff 0%, #36ff8b 100%);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md relative bg-grid-pattern overflow-x-hidden">
<!-- Decorative Background Elements -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container rounded-full blur-[120px] opacity-10"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-tertiary-container rounded-full blur-[150px] opacity-10"></div>
</div>
<!-- Quest Header (Transactional, No Nav Shell) -->
<header class="fixed top-0 left-0 w-full z-50 flex flex-col px-6 pt-6 pb-4 bg-slate-950/80 backdrop-blur-xl border-b border-white/10 shadow-[0_4_20px_rgba(0,0,0,0.5)]"><div class="flex items-center mb-4 max-w-5xl mx-auto w-full justify-center">
<div class="text-center">
<h2 class="font-h3 text-h3 text-on-surface">Cardiovascular Codex</h2>
<p class="font-label-caps text-label-caps text-primary-fixed mt-1 opacity-80">MODULE 4 • ADVANCED DIAGNOSTICS</p>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full max-w-5xl mx-auto">
<div class="flex justify-between text-xs font-label-caps text-label-caps text-on-surface-variant mb-2">
<span>PROGRESS</span>
<span class="text-primary-container">{{ q_index }}/{{ total_q }}</span>
</div>
<div class="w-full bg-surface-container-high h-2 rounded-full overflow-hidden">
<div class="progress-pulse h-full rounded-full" style="width: {{ progress_percent }}%;"></div>
</div>
</div></header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-gutter md:p-margin-desktop z-10">
<div class="w-full max-w-3xl flex flex-col gap-lg">
<!-- Question Card -->
<div class="glass-panel rounded-xl p-lg flex flex-col gap-md relative">
<!-- Subtle Top Accent Line -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-primary-container/50 to-transparent"></div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">vital_signs</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Question {{ q_index }}</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface">{{ question.question }}</h1>
</div>
<!-- Choices Grid -->
<form action="/submit_answer" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-md w-full">
{% for choice in question.choices %}
<button type="submit" name="choice_id" value="{{ choice.id }}" class="glass-panel rounded-lg p-md flex items-center gap-md text-left hover:bg-surface-container-high hover:border-primary-fixed-dim hover:neon-glow transition-all group w-full">
<div class="w-12 h-12 flex-shrink-0 rounded-DEFAULT bg-surface-container-highest border border-white/10 flex items-center justify-center font-stat-value text-stat-value text-on-surface-variant group-hover:text-primary-fixed-dim group-hover:border-primary-fixed-dim transition-colors">{{ choice.id }}</div>
<span class="font-body-lg text-body-lg text-on-surface">{{ choice.text }}</span>
</button>
{% endfor %}
</form>
</div>
</main>
<!-- Footer Actions (Optional/Contextual for Multiple Choice usually auto-advances, but providing a skip if needed) -->
</body></html>
